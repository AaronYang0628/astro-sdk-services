image:
  repository: ghcr.io/aaronyang0628/astro-sdk-services   # public; one image, SDK chosen via env (default all)
  tag: "9c1fd78e136621c49ff0cd5aa787a0bbdef9d2bc"   # pinned commit SHA (also :latest)
  pullPolicy: IfNotPresent
ingress:
  enabled: true
  className: nginx
  host: astro.example.com
  annotations: {}
  tls: []
allInOne: true      # true: ONE Deployment/Service (SDK=all) serving all paths below; false: one Deployment per SDK
memoryLimitGB: ""   # optional MEM_LIMIT_GB (RLIMIT_AS) override; default 8 in all-in-one, 4 per SDK
services:            # SDK names -> Ingress paths /<name> (and, if allInOne=false, one Deployment + Service each) -> Deployment + Service + Ingress path /<name>
  - name: astropy
  - name: astroquery
  - name: photutils
  - name: astroplan
  - name: sunpy
  - name: euclid
resources:            # all-in-one: MEM_LIMIT_GB defaults to 8 (address-space cap), so give the pod up to 8Gi
  requests: {cpu: 200m, memory: 1Gi}
  limits: {cpu: "2", memory: 8Gi}
euclid:               # euclid FITS cutout: download cache + cutout/preview output, mounted at /data/euclid
  cacheDir: /data/euclid/cache     # -> EUCLID_CACHE_DIR
  outputDir: /data/euclid/cutouts  # -> EUCLID_OUTPUT_DIR
  merRoot: ""                      # optional EUCLID_MER_ROOT (local MER tree; mount it via extraVolumes)
  tileIndex: ""                    # optional EUCLID_TILE_INDEX
  inputRoots: ~                    # EUCLID_INPUT_ROOTS: ':'/',' separated dirs whose files may be passed as local paths.
                                   # unset (~) => code default /home/scientist (or projectStorage.mountPath if changed);
                                   # "" => local paths disabled (http(s) URLs only); "/a:/b" => custom
  projectStorage:                  # optional READ-ONLY mount of the storage behind 021 project pods' /home/scientist,
                                   # so agent paths like /home/scientist/project<id>/Data/x.fits work verbatim. Set ONE source:
    existingClaim: ""              #   PVC name (RWX/ROX, same namespace), mounted readOnly
    hostPath: ""                   #   node directory (only if the pod runs on a node that has the data)
    nfs: {server: "", path: ""}    #   NFS export backing /home/scientist
    subPath: ""                    #   optional subPath inside the volume
    mountPath: /home/scientist     #   keep identical to the project pods' path
    readOnly: true
  storage:
    existingClaim: ""              # PVC name to keep cache/outputs across restarts; empty = emptyDir
    sizeLimit: 20Gi                # emptyDir size limit
extraEnv: []          # extra container env, e.g. [{name: HTTPS_PROXY, value: "http://proxy.example.com:3128"}]
extraVolumes: []      # extra pod volumes
extraVolumeMounts: [] # extra container volumeMounts
auth:
  secretName: ""   # optional. Empty = no auth. Else k8s Secret with key `token` -> API_TOKEN (Bearer auth; /health exempt)

image:
  repository: ghcr.io/example/astro-sdk-services   # placeholder; one image, SDK chosen via env
  tag: "0.1.0"
  pullPolicy: IfNotPresent
ingress:
  enabled: true
  className: nginx
  host: astro.example.com
  annotations: {}
  tls: []
allInOne: true      # true: ONE Deployment/Service (SDK=all) serving all paths below; false: one Deployment per SDK
memoryLimitGB: ""   # optional MEM_LIMIT_GB (RLIMIT_AS) override; default 8 in all-in-one, 4 per SDK
services:            # SDK names -> Ingress paths /<name> (and, if allInOne=false, one Deployment + Service each) -> Deployment + Service + Ingress path /<name>
  - name: astropy
  - name: astroquery
  - name: photutils
  - name: astroplan
  - name: sunpy
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {cpu: "1", memory: 4Gi}
auth:
  secretName: ""   # optional. Empty = no auth. Else k8s Secret with key `token` -> API_TOKEN (Bearer auth; /health exempt)

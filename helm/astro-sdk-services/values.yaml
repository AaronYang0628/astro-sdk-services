image:
  repository: ghcr.io/aaronyang0628/astro-sdk-services   # public; one image, SDK chosen via env (default all)
  tag: "9a1c0a0cf188f2782616f35301c300ca5001af0b"   # pinned commit SHA (also :latest)
  pullPolicy: IfNotPresent
ingress:
  enabled: true
  className: nginx
  host: astro.example.com
  annotations: {}
  tls: []
allInOne: true      # true: ONE Deployment/Service (SDK=all) serving all paths below; false: one Deployment per SDK
memoryLimitGB: ""   # optional MEM_LIMIT_GB (RLIMIT_AS) override; default 8 in all-in-one, 4 per SDK
services:            # SDK names -> Ingress paths /<name> (and, if allInOne=false, one Deployment + Service each) -> Deployment + Service + Ingress path /<name>
  - name: astropy
  - name: astroquery
  - name: photutils
  - name: astroplan
  - name: sunpy
  - name: euclid
resources:            # all-in-one: MEM_LIMIT_GB defaults to 8 (address-space cap), so give the pod up to 8Gi
  requests: {cpu: 200m, memory: 1Gi}
  limits: {cpu: "2", memory: 8Gi}
euclid:               # euclid FITS cutout: download cache + cutout/preview output, mounted at /data/euclid
  cacheDir: /data/euclid/cache     # -> EUCLID_CACHE_DIR
  outputDir: /data/euclid/cutouts  # -> EUCLID_OUTPUT_DIR
  merRoot: ""                      # optional EUCLID_MER_ROOT (local MER tree; mount it via extraVolumes)
  tileIndex: ""                    # optional EUCLID_TILE_INDEX
  inputRoots: ~                    # EUCLID_INPUT_ROOTS: ':'/',' separated dirs whose files may be passed as local paths.
                                   # unset (~) => code default /home/scientist (or projectStorage.mountPath if changed);
                                   # "" => local paths disabled (http(s) URLs only); "/a:/b" => custom
  writeRoots: ~                    # EUCLID_WRITE_ROOTS: dirs where tools may write when given an explicit output_path/output_dir
                                   # (e.g. /home/scientist/project<id>/ResearchSpace/x.png -> 021 科研空间).
                                   # unset (~) => code default /home/scientist (or projectStorage.mountPath if changed);
                                   # "" => external writes disabled (only EUCLID_OUTPUT_DIR); "/a:/b" => custom
  projectStorage:                  # optional mount of the storage behind 021 project pods' /home/scientist, so agent paths
                                   # like /home/scientist/project<id>/Data/x.fits (input) and .../ResearchSpace/ (output_path) work verbatim. Set ONE source:
    existingClaim: ""              #   PVC name (RWX, same namespace)
    hostPath: ""                   #   node directory (only if the pod runs on a node that has the data)
    nfs: {server: "", path: ""}    #   NFS export backing /home/scientist
    subPath: ""                    #   optional subPath inside the volume
    mountPath: /home/scientist     #   keep identical to the project pods' path
    readOnly: false                #   false (default since 0.2.5) = read-write, required for output_path into ResearchSpace;
                                   #   true = read-only (inputs only; output_path there then fails with "not writable")
  oss:                             # optional result delivery through an OSS-compatible bucket (presigned download_url), see docs/DEPLOY.md 6.6
    existingSecret: ""             #   name of a k8s Secret with keys: endpoint, bucket, accessKeyId, accessKeySecret (empty = feature off)
    prefix: ""                     #   EUCLID_OSS_PREFIX (code default euclid-mcp/)
    urlExpires: ""                 #   EUCLID_OSS_URL_EXPIRES seconds (code default 604800 = 7 days)
    verifyTls: ""                  #   EUCLID_OSS_VERIFY_TLS: "true"/"false" (code default false: self-signed endpoint chains)
    caBundle: ""                   #   EUCLID_OSS_CA_BUNDLE: CA file path inside the container (mount it via extraVolumes)
  storage:
    existingClaim: ""              # PVC name to keep cache/outputs across restarts; empty = emptyDir
    sizeLimit: 20Gi                # emptyDir size limit
securityContext: {}   # pod securityContext; {} = image default (runs as root, uid 0). The uid/gid must be able to write the
                      # project storage for output_path, e.g. {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000} to match project pods
                      # (NFS with root_squash maps root to nobody -> set runAsUser/runAsGroup to the owner of /home/scientist/project*)
extraEnv: []          # extra container env, e.g. [{name: HTTPS_PROXY, value: "http://proxy.example.com:3128"}]
extraVolumes: []      # extra pod volumes
extraVolumeMounts: [] # extra container volumeMounts
auth:
  secretName: ""   # optional. Empty = no auth. Else k8s Secret with key `token` -> API_TOKEN (Bearer auth; /health exempt)

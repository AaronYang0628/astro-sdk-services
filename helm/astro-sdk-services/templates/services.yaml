{{- if .Values.allInOne }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-all
  labels: {app: astro-all}
spec:
  replicas: 1
  selector:
    matchLabels: {app: astro-all}
  template:
    metadata:
      labels: {app: astro-all}
    spec:
      {{- with .Values.securityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: all
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: SDK, value: "all"}
            {{- include "astro.euclidEnv" . | nindent 12 }}
            {{- if .Values.memoryLimitGB }}
            - {name: MEM_LIMIT_GB, value: {{ .Values.memoryLimitGB | quote }}}
            {{- end }}
            {{- if .Values.auth.secretName }}
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.secretName }}, key: token}}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports: [{containerPort: 8000}]
          volumeMounts:
            {{- include "astro.euclidMounts" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30}  # /health can block while a sync-bound tool call runs
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "astro.euclidVolume" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: astro-all
spec:
  selector: {app: astro-all}
  ports: [{port: 80, targetPort: 8000}]
{{- else }}
{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-{{ .name }}
  labels: {app: astro-{{ .name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app: astro-{{ .name }}}
  template:
    metadata:
      labels: {app: astro-{{ .name }}}
    spec:
      {{- with $.Values.securityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - {name: SDK, value: {{ .name | quote }}}
            {{- if eq .name "euclid" }}
            {{- include "astro.euclidEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $.Values.memoryLimitGB }}
            - {name: MEM_LIMIT_GB, value: {{ $.Values.memoryLimitGB | quote }}}
            {{- end }}
            {{- if $.Values.auth.secretName }}
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $.Values.auth.secretName }}, key: token}}
            {{- end }}
            {{- with $.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports: [{containerPort: 8000}]
          {{- if eq .name "euclid" }}
          volumeMounts:
            {{- include "astro.euclidMounts" $ | nindent 12 }}
          {{- end }}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30}  # /health can block while a sync-bound tool call runs
          resources: {{- toYaml $.Values.resources | nindent 12 }}
      {{- if eq .name "euclid" }}
      volumes:
        {{- include "astro.euclidVolume" $ | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: astro-{{ .name }}
spec:
  selector: {app: astro-{{ .name }}}
  ports: [{port: 80, targetPort: 8000}]
{{- end }}
{{- end }}

{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-{{ .name }}
  labels: {app: astro-{{ .name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app: astro-{{ .name }}}
  template:
    metadata:
      labels: {app: astro-{{ .name }}}
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - {name: SDK, value: {{ .name | quote }}}
            {{- if $.Values.auth.secretName }}
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $.Values.auth.secretName }}, key: token}}
            {{- end }}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30}  # /health can block while a sync-bound tool call runs
          resources: {{- toYaml $.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: astro-{{ .name }}
spec:
  selector: {app: astro-{{ .name }}}
  ports: [{port: 80, targetPort: 8000}]
{{- end }}

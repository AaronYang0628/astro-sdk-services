name: image
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks (binary, no license needed)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --exit-code 1 .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt pytest httpx
      - name: pytest (offline tests)
        run: python -m pytest -q tests/test_telemetry.py tests/test_euclid_smoke.py::test_library_mock
  build:
    needs: [gitleaks, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            image: ["Dockerfile", "requirements.txt", "common/**", "sdks/**", "data/**", "fixtures/**", "euclid_cutout/**", ".github/workflows/image.yml"]
      - uses: docker/login-action@v3
        if: steps.f.outputs.image == 'true' || github.event_name == 'workflow_dispatch'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        if: steps.f.outputs.image == 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          push: true
          tags: ghcr.io/aaronyang0628/astro-sdk-services:latest,ghcr.io/aaronyang0628/astro-sdk-services:${{ github.sha }}
